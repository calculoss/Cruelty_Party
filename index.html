<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    maximum-scale=1.0 + user-scalable=no prevents Safari's pinch-zoom
    interfering with the touch joystick.
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <!-- Prevent tap highlight flash on iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>INTEGRITY MARKET</title>
  <style>
    /* ── Reset ────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0e1012;
      overflow: hidden;
      /* Prevent rubber-band scroll on iOS while still getting pointer events */
      touch-action: none;
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
    }

    /* Three.js canvas fills the window */
    #app canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }

    /* ── HUD ─────────────────────────────────────────────── */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      /* safe-area insets for iPad notch / home-bar */
      padding: max(16px, env(safe-area-inset-top))
               max(20px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom))
               max(20px, env(safe-area-inset-left));
    }

    #logo {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: max(22px, env(safe-area-inset-left));
      font-size: 11px;
      letter-spacing: 0.25em;
      color: rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
    }

    #logo .accent {
      color: #00c8e8;
    }

    #phase-tag {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: max(22px, env(safe-area-inset-right));
      font-size: 9px;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.18);
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 8px;
      border-radius: 2px;
    }

    /* Move hint — shown briefly, then fades */
    #hint {
      position: absolute;
      bottom: max(160px, calc(env(safe-area-inset-bottom) + 160px));
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.22);
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      transition: opacity 1s ease;
    }

    #hint.hidden {
      opacity: 0;
    }

    /* ── Touch joystick ──────────────────────────────────── */
    #joystick-zone {
      position: fixed;
      /* Thumb-reach bottom-left, respects safe area */
      bottom: max(44px, env(safe-area-inset-bottom));
      left:   max(36px, env(safe-area-inset-left));
      width:  120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      /* Allow pointer capture on this element */
      touch-action: none;
      pointer-events: all;
    }

    #joystick-handle {
      position: absolute;
      top:  50%;
      left: 50%;
      width:  44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 200, 232, 0.65);
      border: 1px solid rgba(0, 200, 232, 0.9);
      transform: translate(-50%, -50%);
      pointer-events: none;
      /* Hardware-accelerated so it doesn't cause reflows */
      will-change: transform;
    }
  </style>
</head>
<body>
  <!-- Three.js mounts here -->
  <div id="app"></div>

  <!-- HUD overlay (non-interactive, pointer-events: none) -->
  <div id="hud">
    <div id="logo">INTEGRITY <span class="accent">MARKET</span></div>
    <div id="phase-tag">Phase 1 — Foundation</div>
    <div id="hint">WASD / ARROWS — or use the joystick</div>
  </div>

  <!-- Touch joystick (interactive, outside HUD so pointer-events work) -->
  <div id="joystick-zone">
    <div id="joystick-handle"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
