name: Deploy to GitHub Pages

# Deploys on push to main, or any claude/* branch (so you can preview phases
# before merging). The job builds with Vite and publishes the dist/ folder to
# the gh-pages branch via peaceiris/actions-gh-pages.
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push to gh-pages branch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Keep history short; we don't need full build history on gh-pages
          force_orphan: true
